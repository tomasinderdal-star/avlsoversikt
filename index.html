async function pullRemote(){if(!session||!userId()||dirty||pushing)return;try{let row=await remoteRow();if(row){let remote=JSON.stringify(row.data||emptyState()),local=JSON.stringify(D);if(remote!==local)setUserData(row.data||emptyState());syncText('☁️ Synkronisert')}}catch(e){syncText('⚠️ Frakoblet – bruker lokale data',false)}}

function allocations(){
 let remaining={};D.stock.forEach(o=>remaining[o.id]=o.qty);
 let assigned={};
 // Manually chosen/locked doses get priority.
 D.animals.forEach(a=>{if(!latest(a.id)&&a.dose&&remaining[a.dose]>0){assigned[a.id]=a.dose;remaining[a.dose]--}});
 // Then automatically reserve the first available plan alternative of the correct type.
 D.animals.forEach(a=>{if(latest(a.id)||assigned[a.id])return;let p=planForAnimal(a.id);if(!p)return;
   let id=candidateBulls(p).find(b=>{let o=get(b);return o&&(remaining[b]||0)>0});
   if(id){assigned[a.id]=id;remaining[id]--}
 });
 return {assigned,remaining}
}
function best(id){let A=allocations(),bid=A.assigned[id];return bid?get(bid):null}
function followSuggestion(id,A){let p=planForAnimal(id),a=D.animals.find(x=>x.id===id);if(!p)return null;let choices=[...(a?.lockedDose&&a.dose?[a.dose]:[]),...(p.bulls||[]),...candidateBulls(p)];let bid=[...new Set(choices)].find(Boolean);if(!bid)return null;let stock=get(bid);return {id:bid,name:stock?.name||'Fra avlsplan',available:A.remaining[bid]||0,inTank:!!stock}}
function autoAssign(id){let a=D.animals.find(x=>x.id===id),p=planForAnimal(id);if(!a||latest(id)||a.lockedDose||!p)return;let A=allocations();a.dose=A.assigned[id]||null}

function animals(){let months=[...new Set(D.animals.map(a=>a.month||new Date().toISOString().slice(0,7)))].sort();let cur=new Date();for(let d=-1;d<=3;d++){let x=new Date(cur.getFullYear(),cur.getMonth()+d,1),m=x.toISOString().slice(0,7);if(!months.includes(m))months.push(m)}months.sort();let sections=months.map(m=>{let rows=D.animals.filter(a=>a.month===m).map(a=>{let p=planForAnimal(a.id),l=latest(a.id),b=l?followSuggestion(a.id,allocations()):best(a.id),chosen=a.dose?get(a.dose):null,shownType=chosen?chosen.type:(p?effectiveType(p):''),shownBreed=chosen?chosen.breed:(p?.breed||'');return `<tr draggable="${!l}" ondragstart="event.dataTransfer.setData('text/plain','${a.id}')"><td><b>${a.id}</b></td><td>${p&&p.av!==undefined&&p.av!==null?p.av:'–'}</td><td>${shownType?`<span class="pill ${cls(shownType)}">${shownType}</span>`:'–'}</td><td>${shownBreed}</td><td>${b?`${b.id} (${l?(b.available>0?'forslag – ledig':'forslag – må kjøpes / reservert'):b.qty})`:'–'} <button class="secondary mini" onclick="doseBox('${a.id}')">Endre</button></td><td>${l?noDate(l.date):''}</td><td>${l?noDate(plus21(l.date)):''}</td><td><button class="primary mini" onclick="openIns('${a.id}')">Inseminer</button> ${!l?`<button class="secondary mini" onclick="moveAnimalMonth('${a.id}','${nextMonth(m)}')">Neste måned</button>`:''} <button class="danger mini" onclick="removeAnimal('${a.id}')">Fjern</button></td></tr>`}).join('');return `<h3 style="text-transform:capitalize;margin-top:22px">${monthLabel(m)}</h3><div class="card" style="padding:0;overflow:auto;min-height:70px" ondragover="event.preventDefault()" ondrop="event.preventDefault();moveAnimalMonth(event.dataTransfer.getData('text/plain'),'${m}')">${rows?`<table><tr><th>Nr</th><th>AV</th><th>Type</th><th>Rase</th><th>Forslag fra dunk</th><th>Sist inseminert</th><th>Forventet ny brunst +21</th><th></th></tr>${rows}</table>`:'<div class="muted" style="padding:20px">Ingen dyr – dra et dyr hit</div>'}</div>`}).join('');document.getElementById('a function needs(){let A=allocations(),out=[];D.animals.forEach(a=>{if(latest(a.id))return;let p=planForAnimal(a.id);if(!p||A.assigned[a.id])return;out.push({id:p.bulls[0]||(p.breed||'Uspesifisert'),type:effectiveType(p),breed:p.breed||'',cow:a.id,bullId:p.bulls[0]||''})});return out}
function purchaseGroups(){let g={};needs().forEach(x=>{let k=x.id+'|'+x.type+'|'+x.breed;g[k]??={...x,n:0,cows:[],extra:0};g[k].n++;g[k].cows.push(x.cow)});(D.extraPurchases||[]).forEach(x=>{let k=x.id+'|'+x.type+'|'+x.breed;g[k]??={id:x.id,bullId:x.id,name:x.name||'',breed:x.breed,type:x.type,n:0,cows:[],extra:0};g[k].n+=x.qty;g[k].extra+=x.qty;if(x.name)g[k].name=x.name});return Object.values(g)}
function receivePurchase(i){let x=purchaseGroups()[i];if(!x)return alert('Innkjøpslisten er oppdatert. Prøv igjen.');let stock=x.bullId?get(x.bullId):null;let breeds=['NRF','Holstein','Fleckvieh','Aberdeen Angus','Charolais'];document.getElementById('box').innerHTML=`<h2>Legg kjøpte doser i dunken</h2><p class="muted">Registrer bare dosene du fysisk har mottatt.</p><div class="row"><label>Oksenummer</label><input id="recvId" value="${x.bullId||''}" placeholder="Skriv oksenummer"></div><div class="row"><label>Navn (valgfritt)</label><input id="recvName" value="${stock?.name||x.name||''}" placeholder="Navn på oksen"></div><div class="row"><label>Rase</label><select id="recvBreed">${breeds.map(z=>`<option ${z===(stock?.breed||x.breed)?'selected':''}>${z}</option>`).join('')}</select></div><div class="row"><label>Sædtype</label><select id="recvType">${['Vanlig','KJS','KJM'].map(z=>`<option ${z===(stock?.type||x.type)?'selected':''}>${z}</option>`).join('')}</select></div><div class="row"><label>Antall mottatte doser</label><input id="recvQty" type="number" min="1" step="1" value="${x.n}"></div><div class="actions"><button class="primary" onclick="confirmReceivePurchase()">Legg i dunken</button><button class="secondary" onclick="closeM()">Avbryt</button></div>`;document.getElementById('modal').classList.add('on')}
function confirmReceivePurchase(){let id=document.getElementById('recvId').value.trim(),name=document.getElementById('recvName').value.trim(),breed=document.getElementById('recvBreed').value,type=document.getElementById('recvType').value,qty=Number(document.getElementById('recvQty').value);if(!/^\\d{4,6}$/.test(id))return alert('Skriv et gyldig oksenummer.');if(!Number.isSafeInteger(qty)||qty<1)return alert('Antall doser må være et heltall over null.');let existing=get(id);if(existing&&(existing.breed!==breed||existing.type!==type))return alert('Oksen finnes allerede i dunken med en annen rase eller sædtype. Kontroller opplysningene.');if(!confirm('Legge '+qty+' mottatte doser av '+id+' i sæddunken?'))return;if(existing){existing.qty+=qty;if(name)existing.name=name}else D.stock.push({id,name:name||id,breed,type,qty});let left=qty;D.extraPurchases=(D.extraPurchases||[]).filter(x=>{if(x.id!==id||x.breed!==breed||x.type!==type||left<=0)return true;let take=Math.min(left,x.qty);x.qty-=take;left-=take;return x.qty>0});closeM();save()}
function addExtraPurchase(){let breeds=['NRF','Holstein','Fleckvieh','Aberdeen Angus','Charolais'];document.getElementById('box').innerHTML=`<h2>Legg til ekstra doser</h2><div class="row"><label>Oksenummer</label><input id="extraId" inputmode="numeric" placeholder="Oksenummer"></div><div class="row"><label>Navn (valgfritt)</label><input id="extraName" placeholder="Navn på oksen"></div><div class="row"><label>Rase</label><select id="extraBreed">${breeds.map(z=>`<option>${z}</option>`).join('')}</select></div><div class="row"><label>Sædtype</label><select id="extraType"><option>Vanlig</option><option>KJS</option><option>KJM</option></select></div><div class="row"><label>Antall ekstra doser</label><input id="extraQty" type="number" min="1" step="1" value="1"></div><div class="actions"><button class="primary" onclick="saveExtraPurchase()">Legg til på innkjøpsliste</button><button class="secondary" onclick="closeM()">Avbryt</button></div>`;document.getElementById('modal').classList.add('on')}
function saveExtraPurchase(){let id=document.getElementById('extraId').value.trim(),name=document.getElementById('extraName').value.trim(),breed=document.getElementById('extraBreed').value,type=document.getElementById('extraType').value,qty=Number(document.getElementById('extraQty').value);if(!/^\\d{4,6}$/.test(id))return alert('Skriv et gyldig oksenummer.');if(!Number.isSafeInteger(qty)||qty<1)return alert('Antall må være et heltall over null.');let stock=get(id);if(stock&&(stock.breed!==breed||stock.type!==type))return alert('Oksen finnes i dunken med annen rase eller sædtype.');let x=D.extraPurchases.find(x=>x.id===id&&x.breed===breed&&x.type===type);if(x){x.qty+=qty;if(name)x.name=name}else D.extraPurchases.push({id,name,breed,type,qty});closeM();save()}
function removeExtraPurchase(i){let x=purchaseGroups()[i];if(!x||!x.extra)return;if(!confirm('Fjerne '+x.extra+' ekstra doser av '+x.id+' fra innkjøpslista?'))return;D.extraPurchases=D.extraPurchases.filter(y=>!(y.id===x.id&&y.breed===x.breed&&y.type===x.type));save()}
function semenRoute(){let dates=[['2026-01-23',0],['2026-02-27',0],['2026-03-27',1],['2026-05-01',0],['2026-06-05',1],['2026-07-10',0],['2026-08-21',0],['2026-09-18',0],['2026-10-23',1],['2026-11-20',0],['2026-12-18',1]],today=new Date(),key=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0'),next=dates.find(x=>x[0]>=key);return next?{date:next[0],elite:!!next[1]}:null}
function buy(){let groups=purchaseGroups(),r=groups.map((x,i)=>`<tr><td><b>${x.id}</b></td><td>${x.type}</td><td>${x.n}</td><td>${x.cows.join(', ')||'Ekstra bestilling'}${x.extra?' · +'+x.extra+' ekstra':''}</td><td><button class="primary mini" onclick="receivePurchase(${i})">Mottatt – legg i dunken</button>${x.extra?` <button class="secondary mini" onclick="removeExtraPurchase(${i})">Fjern ekstra</button>`:''}</td></tr>`).join(''),sr=semenRoute(),route=sr?`<div class="card"><div class="muted">Neste sædrute · Circle K Korgen</div><div class="big" style="font-size:24px">${noDate(sr.date)}${sr.elite?' *':''}</div>${sr.elite?'<div class="muted">* Nye eliteokser</div>':''}</div>`:'<div class="card"><div class="muted">Sædrute · Circle K Korgen</div><b>Ingen flere registrerte sædruter i 2026.</b></div>';document.getElementById('buy').innerHTML=`<h2>🛒 Innkjøp</h2><button class="primary" onclick="addExtraPurchase()">+ Legg til ekstra doser</button>${route}<p class="muted">Når du har mottatt dosene, trykk «Mottatt – legg i dunken». Kontroller oksenummer, type og antall før lagring.</p>${r?`<div class="card" style="padding:0;overflow:auto"><table><tr><th>Okse</th><th>Type</th><th>Antall</th><th>Dyr</th><th></th></tr>${r}</table></div>`:'<div class="ok">Ingen mangler beregnet.</div>'}`}
function plan(){let m=D.planMeta||{},r=Object.entries(P).map(([id,p])=>`<tr><td>${id}</td><td>${p.type}</td><td>${p.breed||''}</td><td>${p.bulls.join(' · ')||'Ikke oppgitt'}</td></tr>`).join(''),arc=(D.planArchive||[]).slice().reverse().map(x=>`<tr><td>${x.version||'Ukjent'}</td><td>${x.printDate||''}</td><td>${x.fileName||''}</td><td>${x.count||0}</td></tr>`).join('');document.getElementById('plan').innerHTML=`<h2>📋 Avlsplan</h2><div class="grid"><div class="card"><div class="muted">Gjeldende versjon</div><div class="big" style="font-size:22px">${m.version||'Ukjent'}</div></div><div class="card"><div class="muted">Utskriftsdato</div><div class="big" style="font-size:22px">${m.printDate||'Ukjent'}</div></div><div class="card"><div class="muted">Dyr i planen</div><div class="big">${Object.keys(P).length}</div></div></div><div class="card"><b>Gjeldende avlsplan</b><div class="muted" style="margin-top:6px">${m.farm||''}</div><div class="muted">${m.fileName||''}</div></div><div class="ok">KJS = kjønnseparert ku · KJM = kjønnseparert okse.</div><div class="card"><b>Last opp ny avlsplan</b><input type="file" accept=".pdf,application/pdf" onchange="planUpload(this)"><div id="planMsg" class="muted" style="margin-top:6px">PDF-en leses i appen. Hvis lesingen feiler, beholdes dagens plan uendret.</div></div><div class="card" style="padding:0;overflow:auto"><table><tr><th>Dyr</th><th>Type</th><th>Rase</th><th>Oksealternativer</th></tr>${r}</table></div>${arc?`<h3>Tidligere avlsplaner</h3><div class="card" style="padding:0;overflow:auto"><table><tr><th>Versjon</th><th>Dato</th><th>Fil</th><th>Dyr</th></tr>${arc}</table></div>`:''}`}

async function loadPdfJs(){if(window.pdfjsLib)return window.pdfjsLib;await new Promise((ok,fail)=>{let x=document.createElement('script');x.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';x.onload=ok;x.onerror=()=>fail(new Error('Kunne ikke laste PDF-leseren. Kontroller internett.'));document.head.appendChild(x)});pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';return pdfjsLib}
async function readPlanPdf(file){let lib=await loadPdfJs(),pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise,lines=[];for(let n=1;n<=pdf.numPages;n++){let pg=await pdf.getPage(n),tc=await pg.getTextContent(),ys={};tc.items.forEach(i=>{let y=Math.round(i.transform[5]);(ys[y]??=[]).push(i)});Object.keys(ys).sort((x,y)=>y-x).forEach(y=>lines.push(ys[y].sort((x,y)=>x.transform[4]-y.transform[4]).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim()))}return lines.filter(Boolean)}
function parsePlan(lines){let text=lines.join('\n'),out={};for(let line of lines){let m=line.match(/^\s*(\d{4})\s+(\d{10,14})\s+(\d{4})\s+(\d{5})\s+(?:(?:GS)\s+)?(-?\d+)?\s*(NRF|Aberdeen Angus|Charolais|Holstein|Fleckvieh)\s+(Vanlig|KJS|KJM)\b(.*)$/i);if(!m)continue;let id=m[1],av=m[5]!==undefined&&m[5]!==''?Number(m[5]):null,breed=m[6].replace(/\s+/g,' ').trim(),type=m[7].toLowerCase()==='vanlig'?'Vanlig':m[7].toUpperCase();if(breed==='Aberdeen Angus'||breed==='Charolais')type='KJM';if(breed==='Holstein'||breed==='Fleckvieh')type='KJS';let bulls=[...new Set((m[8].match(/\b\d{5}\b/g)||[]))].slice(0,4);out[id]={type,bulls,breed,av}}let vm=text.match(/Okseutvalg\s*:?\s*([^\n]+)/i),dm=text.match(/Utskriftsdato\s*:?\s*(\d{1,2}\.\d{1,2}\.\d{4})/i),fm=text.match(/(\d{8})\s*[-–]\s*([^\n]+)/);return{plan:out,meta:{version:vm?vm[1].trim().slice(0,70):'Ukjent',printDate:dm?dm[1]:'Ukjent',farm:fm?(fm[1]+' – '+fm[2].trim().slice(0,80)):'',rawCount:Object.keys(out).length}}}
async function planUpload(inp){let file=inp.files&&inp.files[0],msg=document.getElementById('planMsg');if(!file)return;try{if(msg)msg.textContent='Leser PDF…';let parsed=parsePlan(await readPlanPdf(file)),count=Object.keys(parsed.plan).length;if(!count)throw new Error('Fant ingen dyr i PDF-en. Dagens plan er ikke endret.');let oldMeta={...(D.planMeta||{}),count:Object.keys(P).length};D.planArchive=D.planArchive||[];D.planArchive.push(oldMeta);D.planHistory=D.planHistory||[];D.planHistory.push({meta:oldMeta,plan:JSON.parse(JSON.stringify(P))});D.planMeta={...parsed.meta,fileName:file.name,uploadedAt:new Date().toISOString()};D.planData=parsed.plan;P=D.planData;autoAssignAll();save();alert('Ny avlsplan lest inn: '+D.planMeta.version+' · '+count+' dyr i planen. Dyr legges til manuelt under Dyr.')}catch(e){if(msg)msg.textContent='Feil: '+e.message;alert(e.message)}finally{inp.value=''}}
function bullBox(){document.getElementById('box').innerHTML=`<h2>Legg til okse i dunken</h2><div class="row"><label>Oksenummer</label><input id="bid"></div><div class="row"><label>Navn</label><input id="bname"></div><div class="row"><label>Rase</label><select id="bbreed"><option>NRF</option><option>Holstein</option><option>Fleckvieh</option><option>Aberdeen Angus</option><option>Charolais</option></select></div><div class="row"><label>Type</label><select id="btype"><option>Vanlig</option><option>KJS</option><option>KJM</option></select><div class="muted">KJS = ku · KJM = okse</div></div><div class="row"><label>Antall doser</label><input id="bqty" type="number" min="1" value="1"></div><button class="primary" onclick="addBull()">Lagre</button> <button class="secondary" onclick="closeM()">Avbryt</button>`;document.getElementById('modal').classList.add('on')}
function addBull(){let id=bid.value.trim();if(!id)return alert('Skriv oksenummer.');let e=get(id),q=Math.max(1,+bqty.value||1);if(e)e.qty+=q;else D.stock.push({id,name:bname.value.trim()||id,breed:bbreed.value,type:btype.value,qty:q});closeM();save()}
function rmBull(id){let s=get(id);if(!s)return;document.getElementById('box').innerHTML=`<h2>Fjerne okse?</h2><p><b>${s.id} – ${s.name}</b></p><p>Dette fjerner oksen og ${s.qty} dose(r) fra sæddunken. Historiske insemineringer beholdes.</p><div class="actions"><button class="danger" onclick="confirmRmBull('${s.id}')">Ja, fjern</button><button class="secondary" onclick="closeM()">Avbryt</button></div>`;document.getElementById('modal').classList.add('on')}

function addAnimalBox(){document.getElementById('box').innerHTML=`<h2>Legg til dyr</h2><div class="row"><label>Dyrenummer</label><input id="aid"></div><div class="row"><label>Planlagt insemineringsmåned</label><input id="amonth" type="month" value="${new Date().toISOString().slice(0,7)}"></div><div class="muted">Hvis dyret finnes i avlsplanen, velger programmet automatisk første passende tilgjengelige dose. Hvis ingen passer, kommer dyret på innkjøpslisten.</div><div class="actions"><button class="primary" onclick="addAnimal()">Legg til</button> <button class="secondary" onclick="closeM()">Avbryt</button></div>`;document.getElementById('modal').classList.add('on')}

function doseBox(id){let a=D.animals.find(x=>x.id===id),p=planForAnimal(id);if(!a)return;let compatible=D.stock.filter(o=>o.qty>0);let opts=`<option value="">Automatisk forslag fra avlsplan</option>`+compatible.map(o=>`<option value="${o.id}" ${a.dose===o.id?'selected':''}>${o.id} – ${o.name} – ${o.type} | i dunk ${o.qty}, reservert ${reservedCount(o.id)}, ledig ${freeCount(o.id)}</option>`).join('');let plan=p?.bulls?.length?p.bulls.join(', '):'Ingen spesifikke oksealternativer';document.getElementById('box').innerHTML=`<h2>Velg dose for dyr ${id}</h2><div class="row"><label>Dose/okse</label><select id="doseChoice">${opts}</select></div><div class="muted">Alle okser med dose i dunken kan velges manuelt, også en annen sædtype enn avlsplanen. Avlsplan: ${plan}. Et manuelt valg blir beholdt ved senere avlsplaner. Dosen trekkes først når insemineringen registreres.</div><div class="actions"><button class="primary" onclick="saveDose('${id}')">Lagre valg</button><button class="secondary" onclick="closeM()">Avbryt</button></div>`;document.getElementById('modal').classList.add('on')}

function openIns(id){let p=planForAnimal(id),a=D.animals.find(x=>x.id===id),A=allocations(),own=A.assigned[id]||(latest(id)?followSuggestion(id,A)?.id:null);let arr=D.stock.filter(o=>o.qty>0&&((A.remaining[o.id]||0)>0||(!latest(id)&&o.id===own)));arr.sort((x,y)=>(x.id===own?-1:y.id===own?1:0));let options=arr.map(o=>`<option value="${o.id}">${o.id} – ${o.name} – ${o.type} (${o.id===own?(latest(id)?'forslag – ikke reservert':'reservert til dette dyret'):(A.remaining[o.id]||0)+' ledig'})</option>`).join('');document.getElementById('box').innerHTML=`<h2>Inseminer dyr ${id}</h2><div class="row"><label>Okse/dose</label><select id="ibull">${options}</select></div><div class="row"><label>Dato</label><input id="idate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="muted">Alle ledige okser i dunken kan velges manuelt, også KJM/KJS/Vanlig uavhengig av avlsplanen. Etter registrering trekkes én fysisk dose. Forventet ny brunst settes til +21 dager.</div><div class="actions"><button class="primary" onclick="doIns('${id}')">Registrer</button><button class="secondary" onclick="closeM()">Avbryt</button></div>`;document.getElementById('modal').classList.add('on')}
function doIns(id){let s=get(ibull.value);if(!s||s.qty<1)return alert('Ingen dose tilgjengelig.');s.qty--;D.ins.push({animal:id,bull:s.id,date:idate.value});let a=D.animals.find(x=>x.id===id);if(a){if(idate.value)a.month=idate.value.slice(0,7);a.dose=null;a.lockedDose=false}closeM();save()}

function deleteIns(i){let x=D.ins[i];if(!x)return;document.getElementById('box').innerHTML=`<h2>Slette registrering?</h2><p>Dyr <b>${x.animal}</b>, ${noDate(x.date)}, okse <b>${x.bull}</b>.</p><p>Dosen legges tilbake i dunken dersom oksen fortsatt finnes der.</p><div class="actions"><button class="danger" onclick="confirmDeleteIns(${i})">Ja, slett</button><button class="secondary" onclick="closeM()">Avbryt</button></div>`;document.getElementById('modal').classList.add('on')}
function confirmDeleteIns(i){let x=D.ins[i];if(!x)return;let s=get(x.bull);if(s)s.qty++;D.ins.splice(i,1);closeM();save()}
function closeM(){document.getElementById('modal').classList.remove('on')}document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeM()});window.addEventListener('hashchange',()=>{try{render()}catch(e){showStartupError(e)}});function showStartupError(e){let n=document.getElementById('nav'),m=document.querySelector('main');if(n)n.innerHTML='<button onclick="location.reload()">↻ Last inn på nytt</button>';if(m)m.innerHTML='<div class="card" style="margin:16px"><h2>Appen startet ikke</h2><p>Feilkode: <b>'+String(e&&e.message||e)+'</b></p><p class="muted">Ta bilde av denne meldingen.</p></div>';syncText('⚠️ Oppstartsfeil',false)}try{render()}catch(e){showStartupError(e)}bootAuth();
</script>
<div id="installPwa" style="display:none;position:fixed;right:14px;bottom:76px;z-index:9999">
  <button id="installPwaBtn" style="border:0;border-radius:16px;padding:12px 16px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.18)">Installer Avlsoversikt</button>
</div>
<script>
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredInstallPrompt=e;
  document.getElementById('installPwa').style.display='block';
});
document.getElementById('installPwaBtn').addEventListener('click',async()=>{
  if(!deferredInstallPrompt)return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  document.getElementById('installPwa').style.display='none';
});
window.addEventListener('appinstalled',()=>document.getElementById('installPwa').style.display='none');
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
}
</script>
</body></html>
