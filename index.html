const SB_URL='https://epadjnlmvwjmaomhfdhb.supabase.co';
const SB_KEY='sb_publishable__KXhrthQJOkheQznbH_wyw_QUIYdgqZ';
const SESSION_KEY='avls_supabase_session_v1';
let session=JSON.parse(localStorage.getItem(SESSION_KEY)||'null'), syncTimer=null, pushing=false, dirty=false;
function syncText(t,ok=true){let e=document.getElementById('syncStatus');if(e){e.textContent=t;e.className='syncbar '+(ok?'sync-ok':'sync-warn')}}
async function authFetch(path,opt={}){let h={apikey:SB_KEY,'Content-Type':'application/json',...(opt.headers||{})};if(session?.access_token)h.Authorization='Bearer '+session.access_token;return fetch(SB_URL+path,{...opt,headers:h})}
async function refreshSession(){if(!session?.refresh_token)return false;try{let r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;session=await r.json();localStorage.setItem(SESSION_KEY,JSON.stringify(session));return true}catch(e){return false}}
async function login(){let msg=document.getElementById('loginMsg');msg.textContent='Logger inn…';try{let r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:loginEmail.value.trim(),password:loginPassword.value})});if(!r.ok){msg.textContent='Innlogging mislyktes. Kontroller e-post og passord.';return}session=await r.json();localStorage.setItem(SESSION_KEY,JSON.stringify(session));document.getElementById('auth').classList.add('hide');await firstSync();startSync()}catch(e){msg.textContent='Fikk ikke kontakt med databasen. Kontroller internett.'}}
async function remoteRow(){let r=await authFetch('/rest/v1/app_state?id=eq.main&select=data,revision,updated_at');if(r.status===401&&await refreshSession())return remoteRow();if(!r.ok)throw new Error('read '+r.status);let a=await r.json();return a[0]||null}
async function pushRemote(){if(!session||pushing)return;pushing=true;try{syncText('☁️ Synkroniserer…');let r=await authFetch('/rest/v1/app_state?id=eq.main',{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({data:D})});if(r.status===401&&await refreshSession()){pushing=false;return pushRemote()}if(!r.ok)throw new Error('write '+r.status);dirty=false;syncText('☁️ Synkronisert')}catch(e){dirty=true;syncText('⚠️ Lagret lokalt – venter på nett',false)}finally{pushing=false}}
async function firstSync(){try{let row=await remoteRow();let empty=!row?.data||Object.keys(row.data).length===0;if(empty){dirty=true;await pushRemote()}else{D=row.data;normalizeData();localStorage.setItem('avls_v2',JSON.stringify(D));render();syncText('☁️ Synkronisert')}}catch(e){syncText('⚠️ Kun lokal lagring',false)}}
async function pullRemote(){if(!session||dirty||pushing)return;try{let row=await remoteRow();if(row?.data&&Object.keys(row.data).length){let remote=JSON.stringify(row.data),local=JSON.stringify(D);if(remote!==local){D=row.data;normalizeData();localStorage.setItem('avls_v2',JSON.stringify(D));render()}syncText('☁️ Synkronisert')}}catch(e){syncText('⚠️ Frakoblet – bruker lokale data',false)}}
function startSync(){clearInterval(syncTimer);syncTimer=setInterval(()=>dirty?pushRemote():pullRemote(),15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)(dirty?pushRemote():pullRemote())},{once:false})}
async function bootAuth(){if(session){if(!(await refreshSession())){session=null;localStorage.removeItem(SESSION_KEY)}else{document.getElementById('auth').classList.add('hide');await firstSync();startSync();return}}document.getElementById('auth').classList.remove('hide');syncText('🔒 Logg inn for synkronisering',false)}
const P={
'2254':{type:'KJS',bulls:['12431','12519','12511','12493']},'2255':{type:'Vanlig',bulls:['12518','12496','12521','12527']},
'1845':{type:'Vanlig',bulls:['12511','12524','12492','12523']},'1942':{type:'Vanlig',bulls:['12492','12514','12523','12524']},
'1957':{type:'Vanlig',bulls:['12488','12511','12522','12498']},'2176':{type:'Vanlig',bulls:['12491','12493','12521','12517']},
'1877':{type:'Vanlig',bulls:['12503','12508','12493','12497']},'2259':{type:'Vanlig',bulls:['12495','12521','12498','12508']},
'2261':{type:'Vanlig',bulls:['12488','12511','12497','12521']},'2262':{type:'KJM',bulls:[],breed:'Aberdeen Angus'},
'1848':{type:'KJS',bulls:['12519','12431','12522','12511']},'2109':{type:'Vanlig',bulls:['12504','12492','12527','12497']},
'2181':{type:'Vanlig',bulls:['12493','12521','12491','12511']},'2183':{type:'Vanlig',bulls:['12505','12518','12527','12497']},
'2009':{type:'KJS',bulls:['12497','12524','12521','12508']},'2142':{type:'Vanlig',bulls:['12505','12517','12436','12493']}};
const initial=[['12462','NR Nordseth','NRF','Vanlig',1],['12478','NR Garvikingen-P','NRF','Vanlig',1],['12481','NR Midøy-PP','NRF','Vanlig',1],['12491','NR Horne-PP','NRF','Vanlig',1],['12492','NR Vigdal-PP','NRF','Vanlig',1],['12495','NR Starset-PP','NRF','Vanlig',1],['12497','NR Negard','NRF','KJS',1],['12503','NR Grude-PP','NRF','Vanlig',2],['12504','NR Skjeldal-PP','NRF','Vanlig',1],['12511','NR Nigard-PP','NRF','Vanlig',2],['12517','NR Folen-PP','NRF','Vanlig',2],['12518','NR Jonstuen-PP','NRF','Vanlig',3],['12522','NR Gronlio-P','NRF','Vanlig',1],['30458','Oscar','Holstein','KJS',4],['73622','Maxxis PP','Fleckvieh','KJS',2],['70266','VB Usko PP','Charolais','KJM',5],['74132','VB Ursus','Aberdeen Angus','KJM',5],['74154','Nuera 1047','Aberdeen Angus','KJM',5]];
const ids=Object.keys(P);
let D=JSON.parse(localStorage.getItem('avls_v2')||'null')||{stock:initial.map(x=>({id:x[0],name:x[1],breed:x[2],type:x[3],qty:x[4]})),animals:ids.map(id=>({id,dose:null})),ins:[]};
function normalizeData(){D.stock=D.stock||[];D.animals=D.animals||[];D.ins=D.ins||[];D.animals.forEach(a=>{if(a.dose===undefined)a.dose=null;if(a.lockedDose===undefined)a.lockedDose=!!a.dose})}
normalizeData();
const save=()=>{localStorage.setItem('avls_v2',JSON.stringify(D));dirty=true;render();pushRemote()}, get=id=>D.stock.find(x=>x.id===id), cls=t=>t==='KJS'?'kjs':t==='KJM'?'kjm':'vanlig';
function plus21(d){let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+21);return x.toISOString().slice(0,10)}
function noDate(d){if(!d)return'';return new Date(d+'T12:00:00').toLocaleDateString('no-NO')}
function latest(id){return D.ins.filter(x=>x.animal===id).sort((a,b)=>b.date.localeCompare(a.date))[0]}
function allocations(){
 let remaining={};D.stock.forEach(o=>remaining[o.id]=o.qty);
 let assigned={};
 // Manually chosen/locked doses get priority.
 D.animals.forEach(a=>{if(a.dose&&remaining[a.dose]>0){assigned[a.id]=a.dose;remaining[a.dose]--}});
 // Then automatically reserve the first available plan alternative of the correct type.
 D.animals.forEach(a=>{if(assigned[a.id])return;let p=P[a.id];if(!p)return;
   let id=p.bulls.find(b=>{let o=get(b);return o&&o.type===p.type&&(remaining[b]||0)>0});
   if(id){assigned[a.id]=id;remaining[id]--}
 });
 return {assigned,remaining}
}
function best(id){let A=allocations(),bid=A.assigned[id];return bid?get(bid):null}
function autoAssign(id){let a=D.animals.find(x=>x.id===id),p=P[id];if(!a||a.lockedDose||!p)return;let A=allocations();a.dose=A.assigned[id]||null}
function autoAssignAll(){D.animals.forEach(a=>autoAssign(a.id))}
function reservedCount(id){let A=allocations(),n=0;Object.values(A.assigned).forEach(x=>{if(x===id)n++});return n}
function freeCount(id){let o=get(id);return o?Math.max(0,o.qty-reservedCount(id)):0}
function nav(){let a=[['home','🏠 Oversikt'],['animals','🐄 Dyr'],['tank','🧊 Sæddunk'],['history','💉 Historikk'],['buy','🛒 Innkjøp'],['plan','📋 Avlsplan']];document.getElementById('nav').innerHTML=a.map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(x){location.hash=x;render()}
function render(){nav();let x=location.hash.slice(1)||'home';document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));document.getElementById(x).classList.add('on');({home,animals,tank,history,buy,plan}[x])()}
function home(){let today=new Date().toISOString().slice(0,10),cut=new Date();cut.setDate(cut.getDate()+7);let cutS=cut.toISOString().slice(0,10),latestRows=D.animals.map(a=>({a,l:latest(a.id)})).filter(x=>x.l),due=latestRows.filter(x=>plus21(x.l.date)<=cutS).sort((x,y)=>plus21(x.l.date).localeCompare(plus21(y.l.date)));let follow=due.map(x=>{let p=P[x.a.id],A=allocations(),bid=p?.bulls?.find(z=>{let o=get(z);return o&&o.type===p.type&&(A.remaining[z]||0)>0}),b=bid?get(bid):null;return `<tr><td><b>${x.a.id}</b></td><td>${noDate(plus21(x.l.date))}</td><td>${b?`<b>${b.id}</b> – ${b.name} (${A.remaining[bid]} ledig)`:'<span class="muted">Ingen ledig passende dose</span>'}</td><td><button class="primary" onclick="openIns('${x.a.id}')">Inseminer</button> <button class="secondary mini" onclick="doseBox('${x.a.id}')">Endre</button></td></tr>`}).join('');document.getElementById('home').innerHTML=`<div class="grid"><div class="card">🐄 Dyr<div class="big">${D.animals.length}</div></div><div class="card">🧊 Doser<div class="big">${D.stock.reduce((a,x)=>a+x.qty,0)}</div><div class="muted">KJS = ku · KJM = okse</div></div><div class="card">💉 Insemineringer<div class="big">${D.ins.length}</div></div><div class="card">🔁 21 dager nådd<div class="big">${due.length}</div></div></div><div class="ok"><b>Fast regel:</b> KJS = kjønnseparert KU. KJM = kjønnseparert OKSE.</div><h2>🔁 Kommer opp igjen / neste 7 dager</h2><div class="card" style="padding:0;overflow:auto">${follow?`<table><tr><th>Dyr</th><th>Forventet dato</th><th>Foreslått tilgjengelig dose</th><th></th></tr>${follow}</table>`:'Ingen dyr med forventet ny brunst de neste 7 dagene.'}</div>`}
function animals(){let r=D.animals.map(a=>{let p=P[a.id],l=latest(a.id),b=best(a.id);return `<tr><td><b>${a.id}</b></td><td>${p?`<span class="pill ${cls(p.type)}">${p.type}</span>`:'–'}</td><td>${p?.breed||''}</td><td>${b?`${b.id} (${b.qty})`:'–'} <button class="secondary mini" onclick="doseBox('${a.id}')">Endre</button></td><td>${l?noDate(l.date):''}</td><td>${l?noDate(plus21(l.date)):''}</td><td><button class="primary" onclick="openIns('${a.id}')">Inseminer</button> <button class="danger" onclick="removeAnimal('${a.id}')">Fjern</button></td></tr>`}).join('');document.getElementById('animals').innerHTML=`<h2>🐄 Dyr</h2><div class="actions"><button class="primary" onclick="addAnimalBox()">+ Legg til dyr</button></div><div class="card" style="padding:0;overflow:auto"><table><tr><th>Nr</th><th>Type</th><th>Rase</th><th>Forslag fra dunk</th><th>Sist inseminert</th><th>Forventet ny brunst +21</th><th></th></tr>${r}</table></div>`}
function tank(){let totals={stock:0,res:0,free:0};let r=D.stock.map(o=>{let rs=reservedCount(o.id),fr=Math.max(0,o.qty-rs);totals.stock+=o.qty;totals.res+=rs;totals.free+=fr;return `<tr><td><b>${o.id}</b></td><td>${o.name}</td><td>${o.breed}</td><td><span class="pill ${cls(o.type)}">${o.type}</span></td><td><b>${o.qty}</b></td><td>${rs}</td><td><b>${fr}</b></td><td><button class="secondary mini" onclick="chg('${o.id}',1)">+</button> <button class="secondary mini" onclick="chg('${o.id}',-1)">−</button> <button class="danger mini" onclick="rmBull('${o.id}')">Fjern</button></td></tr>`}).join('');document.getElementById('tank').innerHTML=`<h2>🧊 Sæddunk</h2><div class="grid"><div class="card">I dunk<div class="big">${totals.stock}</div><div class="muted">fysiske doser</div></div><div class="card">Reservert<div class="big">${totals.res}</div><div class="muted">satt av til dyr</div></div><div class="card">Ledig<div class="big">${totals.free}</div><div class="muted">kan brukes ved omløp/nye dyr</div></div></div><div class="actions"><button class="primary" onclick="bullBox()">+ Legg til okse</button></div><div class="card" style="padding:0;overflow:auto"><table><tr><th>Oksenr.</th><th>Navn</th><th>Rase</th><th>Type</th><th>I dunk</th><th>Reservert</th><th>Ledig</th><th></th></tr>${r}</table></div>`}
function history(){let r=[...D.ins].map((x,i)=>({...x,_i:i})).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td><b>${x.animal}</b></td><td>${noDate(x.date)}</td><td>${x.bull}</td><td>${noDate(plus21(x.date))}</td><td><button class="secondary" onclick="editIns(${x._i})">Rediger</button> <button class="danger" onclick="deleteIns(${x._i})">Slett</button></td></tr>`).join('');document.getElementById('history').innerHTML=`<h2>💉 Insemineringshistorikk</h2><div class="muted" style="margin-bottom:10px">Feilregistreringer kan redigeres eller slettes her. Ved sletting legges dosen tilbake i dunken hvis oksen fortsatt finnes.</div><div class="card" style="padding:0;overflow:auto">${r?`<table><tr><th>Dyr</th><th>Dato</th><th>Okse</th><th>Forventet ny brunst</th><th></th></tr>${r}</table>`:'Ingen registreringer ennå.'}</div>`}
function needs(){let A=allocations(),out=[];D.animals.forEach(a=>{let p=P[a.id];if(!p||A.assigned[a.id])return;out.push({id:p.bulls[0]||(p.breed||'Uspesifisert'),type:p.type,cow:a.id})});return out}
function buy(){let n=needs(),g={};n.forEach(x=>{let k=x.id+'|'+x.type;g[k]??={...x,n:0,cows:[]};g[k].n++;g[k].cows.push(x.cow)});let r=Object.values(g).map(x=>`<tr><td><b>${x.id}</b></td><td>${x.type}</td><td>${x.n}</td><td>${x.cows.join(', ')}</td></tr>`).join('');document.getElementById('buy').innerHTML=`<h2>🛒 Innkjøp</h2>${r?`<div class="card" style="padding:0"><table><tr><th>Okse</th><th>Type</th><th>Antall</th><th>Dyr</th></tr>${r}</table></div>`:'<div class="ok">Ingen mangler beregnet.</div>'}`}
function plan(){let r=Object.entries(P).map(([id,p])=>`<tr><td>${id}</td><td>${p.type}</td><td>${p.breed||''}</td><td>${p.bulls.join(' · ')||'Ikke oppgitt'}</td></tr>`).join('');document.getElementById('plan').innerHTML=`<h2>📋 Avlsplan</h2><div class="grid"><div class="card"><div class="muted">Gjeldende versjon</div><div class="big" style="font-size:22px">2026-2 Landet</div></div><div class="card"><div class="muted">Utskriftsdato</div><div class="big" style="font-size:22px">17.09.2026</div></div><div class="card"><div class="muted">Dyr i planen</div><div class="big">${Object.keys(P).length}</div></div></div><div class="card"><b>Gjeldende avlsplan</b><div class="muted" style="margin-top:6px">18320166 – Reinåga Samdrift DA</div></div><div class="ok">KJS = kjønnseparert ku · KJM = kjønnseparert okse.</div><div class="card"><b>Last opp ny avlsplan</b><input type="file" accept=".pdf" onchange="planUpload(this)"><div class="muted" style="margin-top:6px">Dyr som allerede har fått valgt okse beholder den. Nye/endrede dyr skal automatisk matches mot sæddunken; manglende doser legges på innkjøpslisten.</div></div><div class="card" style="padding:0;overflow:auto"><table><tr><th>Dyr</th><th>Type</th><th>Rase</th><th>Oksealternativer</th></tr>${r}</table></div>`}

function planUpload(inp){if(!inp.files||!inp.files[0])return;autoAssignAll();save();alert('Avlsplanen er registrert. Eksisterende oksevalg er beholdt. Denne prototypen kan foreløpig ikke lese nye dyr direkte ut av PDF-filen i nettleseren, så automatisk PDF-import er neste tekniske steg.')}

function bullBox(){document.getElementById('box').innerHTML=`<h2>Legg til okse i dunken</h2><div class="row"><label>Oksenummer</label><input id="bid"></div><div class="row"><label>Navn</label><input id="bname"></div><div class="row"><label>Rase</label><select id="bbreed"><option>NRF</option><option>Holstein</option><option>Fleckvieh</option><option>Aberdeen Angus</option><option>Charolais</option></select></div><div class="row"><label>Type</label><select id="btype"><option>Vanlig</option><option>KJS</option><option>KJM</option></select><div class="muted">KJS = ku · KJM = okse</div></div><div class="row"><label>Antall doser</label><input id="bqty" type="number" min="1" value="1"></div><button class="primary" onclick="addBull()">Lagre</button> <button class="secondary" onclick="closeM()">Avbryt</button>`;document.getElementById('modal').classList.add('on')}
function addBull(){let id=bid.value.trim();if(!id)return alert('Skriv oksenummer.');let e=get(id),q=Math.max(1,+bqty.value||1);if(e)e.qty+=q;else D.stock.push({id,name:bname.value.trim()||id,breed:bbreed.value,type:btype.value,qty:q});closeM();save()}
function rmBull(id){let s=get(id);if(!s)return;document.getElementById('box').innerHTML=`<h2>Fjerne okse?</h2><p><b>${s.id} – ${s.name}</b></p><p>Dette fjerner oksen og ${s.qty} dose(r) fra sæddunken. Historiske insemineringer beholdes.</p><div class="actions"><button class="danger" onclick="confirmRmBull('${s.id}')">Ja, fjern</button><button class="secondary" onclick="closeM()">Avbryt</button></div>`;document.getElementById('modal').classList.add('on')}
function confirmRmBull(id){D.stock=D.stock.filter(x=>x.id!==id);closeM();save()}
function chg(id,n){let s=get(id);s.qty=Math.max(0,s.qty+n);save()}
function addAnimalBox(){document.getElementById('box').innerHTML=`<h2>Legg til dyr</h2><div class="row"><label>Dyrenummer</label><input id="aid"></div><div class="muted">Hvis dyret finnes i avlsplanen, velger programmet automatisk første passende tilgjengelige dose. Hvis ingen passer, kommer dyret på innkjøpslisten.</div><div class="actions"><button class="primary" onclick="addAnimal()">Legg til</button> <button class="secondary" onclick="closeM()">Avbryt</button></div>`;document.getElementById('modal').classList.add('on')}
function addAnimal(){let id=aid.value.trim();if(!id)return;if(!D.animals.some(x=>x.id===id)){D.animals.push({id,dose:null,lockedDose:false});autoAssign(id)}closeM();save()}
function removeAnimal(id){if(confirm(`Fjerne dyr ${id} fra månedsoversikten? Insemineringshistorikken beholdes.`)){D.animals=D.animals.filter(x=>x.id!==id);save()}}

function doseBox(id){let a=D.animals.find(x=>x.id===id),p=P[id];if(!a)return;let compatible=D.stock.filter(o=>o.qty>0&&(!p||o.type===p.type));let opts=`<option value="">Automatisk forslag fra avlsplan</option>`+compatible.map(o=>`<option value="${o.id}" ${a.dose===o.id?'selected':''}>${o.id} – ${o.name} – ${o.type} | i dunk ${o.qty}, reservert ${reservedCount(o.id)}, ledig ${freeCount(o.id)}</option>`).join('');let plan=p?.bulls?.length?p.bulls.join(', '):'Ingen spesifikke oksealternativer';document.getElementById('box').innerHTML=`<h2>Velg dose for dyr ${id}</h2><div class="row"><label>Dose/okse</label><select id="doseChoice">${opts}</select></div><div class="muted">Avlsplan: ${plan}. Et manuelt valg blir beholdt ved senere avlsplaner. Dosen trekkes først når insemineringen registreres.</div><div class="actions"><button class="primary" onclick="saveDose('${id}')">Lagre valg</button><button class="secondary" onclick="closeM()">Avbryt</button></div>`;document.getElementById('modal').classList.add('on')}
function saveDose(id){let a=D.animals.find(x=>x.id===id);if(a){a.dose=document.getElementById('doseChoice').value||null;a.lockedDose=!!a.dose}closeM();save()}

function openIns(id){let p=P[id],a=D.animals.find(x=>x.id===id),A=allocations(),own=A.assigned[id];let arr=D.stock.filter(o=>o.qty>0&&(!p||o.type===p.type)&&((A.remaining[o.id]||0)>0||o.id===own));arr.sort((x,y)=>(x.id===own?-1:y.id===own?1:0));let options=arr.map(o=>`<option value="${o.id}">${o.id} – ${o.name} – ${o.type} (${o.id===own?'reservert til dette dyret':(A.remaining[o.id]||0)+' ledig'})</option>`).join('');document.getElementById('box').innerHTML=`<h2>Inseminer dyr ${id}</h2><div class="row"><label>Okse/dose</label><select id="ibull">${options}</select></div><div class="row"><label>Dato</label><input id="idate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="muted">Etter registrering trekkes én fysisk dose. Forventet ny brunst settes til +21 dager.</div><div class="actions"><button class="primary" onclick="doIns('${id}')">Registrer</button><button class="secondary" onclick="closeM()">Avbryt</button></div>`;document.getElementById('modal').classList.add('on')}
function doIns(id){let s=get(ibull.value);if(!s||s.qty<1)return alert('Ingen dose tilgjengelig.');s.qty--;D.ins.push({animal:id,bull:s.id,date:idate.value});closeM();save()}
function editIns(i){let x=D.ins[i];if(!x)return;let opts=D.stock.map(s=>`<option value="${s.id}" ${s.id===x.bull?'selected':''}>${s.id} – ${s.name}</option>`).join('');if(!get(x.bull))opts=`<option value="${x.bull}" selected>${x.bull} – ikke i dunk</option>`+opts;document.getElementById('box').innerHTML=`<h2>Rediger inseminering</h2><div class="row"><label>Dyrenummer</label><input id="eanimal" value="${x.animal}"></div><div class="row"><label>Dato</label><input id="edate" type="date" value="${x.date}"></div><div class="row"><label>Okse</label><select id="ebull">${opts}</select></div><div class="muted">Forventet ny brunst beregnes automatisk 21 dager etter ny dato.</div><div class="actions"><button class="primary" onclick="saveEditIns(${i})">Lagre endringer</button><button class="secondary" onclick="closeM()">Avbryt</button></div>`;document.getElementById('modal').classList.add('on')}
function saveEditIns(i){let x=D.ins[i];if(!x)return;let oldBull=x.bull,newBull=document.getElementById('ebull').value;if(newBull!==oldBull){let old=get(oldBull),nw=get(newBull);if(nw&&nw.qty<1)return alert('Ingen dose tilgjengelig av valgt okse.');if(old)old.qty++;if(nw)nw.qty--;}x.animal=document.getElementById('eanimal').value.trim()||x.animal;x.date=document.getElementById('edate').value||x.date;x.bull=newBull;closeM();save()}
function deleteIns(i){let x=D.ins[i];if(!x)return;document.getElementById('box').innerHTML=`<h2>Slette registrering?</h2><p>Dyr <b>${x.animal}</b>, ${noDate(x.date)}, okse <b>${x.bull}</b>.</p><p>Dosen legges tilbake i dunken dersom oksen fortsatt finnes der.</p><div class="actions"><button class="danger" onclick="confirmDeleteIns(${i})">Ja, slett</button><button class="secondary" onclick="closeM()">Avbryt</button></div>`;document.getElementById('modal').classList.add('on')}
function confirmDeleteIns(i){let x=D.ins[i];if(!x)return;let s=get(x.bull);if(s)s.qty++;D.ins.splice(i,1);closeM();save()}
function closeM(){document.getElementById('modal').classList.remove('on')}document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeM()});window.addEventListener('hashchange',()=>{try{render()}catch(e){showStartupError(e)}});function showStartupError(e){let n=document.getElementById('nav'),m=document.querySelector('main');if(n)n.innerHTML='<button onclick="location.reload()">↻ Last inn på nytt</button>';if(m)m.innerHTML='<div class="card" style="margin:16px"><h2>Appen startet ikke</h2><p>Feilkode: <b>'+String(e&&e.message||e)+'</b></p><p class="muted">Ta bilde av denne meldingen.</p></div>';syncText('⚠️ Oppstartsfeil',false)}try{render()}catch(e){showStartupError(e)}bootAuth();
</script>
<div id="installPwa" style="display:none;position:fixed;right:14px;bottom:76px;z-index:9999">
  <button id="installPwaBtn" style="border:0;border-radius:16px;padding:12px 16px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.18)">Installer Avlsoversikt</button>
</div>
<script>
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredInstallPrompt=e;
  document.getElementById('installPwa').style.display='block';
});
document.getElementById('installPwaBtn').addEventListener('click',async()=>{
  if(!deferredInstallPrompt)return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  document.getElementById('installPwa').style.display='none';
});
window.addEventListener('appinstalled',()=>document.getElementById('installPwa').style.display='none');
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
}
</script>
</body></html>
